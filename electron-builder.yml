appId: dev.clawos.app
productName: Clawos
copyright: Copyright © 2026 Clawos contributors
directories:
  buildResources: build
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!docs/*'
  - '!scripts/*'
  - '!.github/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.json,.editorconfig,.nvmrc,.npmrc}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,vitest.config.ts,components.json}'
  - '!{README.md,CONTRIBUTING.md,CHANGELOG.md}'
  # O Clawos usa os CLIs que o usuário instalou; não redistribuímos binários de agentes.
  - '!**/node_modules/@anthropic-ai/claude-agent-sdk-*/**'
  - '!**/node_modules/@openai/codex*/**'
asarUnpack:
  - resources/**
  # Os adaptadores ACP rodam como processos Node separados e precisam ler suas
  # dependências do disco; por isso node_modules e o agentHost ficam fora do asar.
  - node_modules/**
  - out/main/agentHost.js
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # Assinatura com Developer ID + notarização quando há certificado (CSC_LINK) e as
  # credenciais da Apple no ambiente — veja docs/release-macos.md. Sem isso, os scripts
  # dist:mac e o workflow de release usam assinatura ad-hoc (-c.mac.identity=-).
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  artifactName: Clawos-${version}-mac-${arch}.${ext}
dmg:
  artifactName: Clawos-${version}-mac-${arch}.${ext}
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  artifactName: Clawos-${version}-windows-setup.${ext}
  shortcutName: ${productName}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  maintainer: Clawos contributors <clawos@users.noreply.github.com>
  category: Development
  synopsis: Vários agentes de código, vários projetos, um chat limpo
appImage:
  artifactName: Clawos-${version}-linux-${arch}.${ext}
deb:
  artifactName: Clawos-${version}-linux-${arch}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: vdloureiro
  repo: clawos-ADE
  releaseType: draft
