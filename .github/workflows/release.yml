name: Release

# Publicar uma versão: atualize "version" no package.json, crie a tag e envie.
#   git tag v0.1.0 && git push origin v0.1.0
# Os três jobs anexam seus instaladores ao mesmo release em RASCUNHO no GitHub;
# revise e publique manualmente.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Lint e testes rodam no workflow de CI; aqui só o build de produção.
      - run: pnpm build
      - name: Empacotar e anexar ao release
        shell: bash
        run: |
          EXTRA=""
          if [ "$RUNNER_OS" = "macOS" ] && [ -z "$CSC_LINK" ]; then
            # Sem certificado Developer ID: assinatura ad-hoc, sem notarização.
            EXTRA="-c.mac.identity=- -c.mac.hardenedRuntime=false -c.mac.notarize=false"
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          pnpm exec electron-builder ${{ matrix.target }} --publish always $EXTRA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS assinado e notarizado (opcional — veja docs/release-macos.md).
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
